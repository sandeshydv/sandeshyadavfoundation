<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login - Sandesh Yadav Foundation</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--primary:#0f4c81;--gold:#f4b400;}
body{
  font-family:Arial,sans-serif;
  background: linear-gradient(rgba(15,76,129,0.7), rgba(15,76,129,0.7)), url('https://commons.wikimedia.org/wiki/Special:FilePath/Viceregal%20Lodge%27.JPG');
  background-size: cover;
  background-position: center;
  min-height: 100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.topbar{background:var(--primary);color:#fff;padding:8px;text-align:center;position:fixed;top:0;left:0;right:0}
.login-card{
  background:#fff;
  border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,.3);
  padding:40px;
  max-width:420px;
  width:90%;
}
.login-card h2{color:var(--primary);text-align:center;margin-bottom:10px}
.login-card p.subtitle{color:#666;text-align:center;margin-bottom:25px}
.btn-login{
  background:var(--primary);
  color:#fff;
  border:none;
  width:100%;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
}
.btn-login:hover{background:#0c3d68;color:#fff}
#errorMsg{display:none;color:#c0392b;text-align:center;margin-top:10px}
</style>
</head>
<body>

<div class="topbar">
📞 +91 1234567890 | ✉️ vivoy15ssandesh@gmail.com
</div>

<div class="login-card">
<h2>🎓 Student Login</h2>
<p class="subtitle">Enter your name and access code to view study material</p>

<form id="loginForm">
  <div class="mb-3">
    <label class="form-label">Your Name</label>
    <input type="text" class="form-control" id="studentName" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Access Code</label>
    <input type="password" class="form-control" id="accessCode" required>
  </div>
  <button type="submit" class="btn btn-login">Login</button>
  <p id="errorMsg">Incorrect access code. Please try again.</p>
</form>

<p class="mt-3 text-center text-muted" style="font-size:14px;">
Don't have an access code? Contact us at vivoy15ssandesh@gmail.com
</p>

<p class="mt-2 text-center">
<a href="index.html" style="color:var(--primary);text-decoration:none;">← Back to Home</a>
</p>
</div>

<script>
// NOTE: This is a simple shared access-code gate for a static site (no backend/server).
// It is NOT secure storage of secrets — anyone who views this file's source can see the code.
// It's meant to keep casual visitors out, not to protect sensitive information.
const ACCESS_CODE = "SYF2026";

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const name = document.getElementById('studentName').value.trim();
  const code = document.getElementById('accessCode').value.trim();
  const errorMsg = document.getElementById('errorMsg');

  if(code === ACCESS_CODE && name.length > 0){
    sessionStorage.setItem('syf_student_name', name);
    sessionStorage.setItem('syf_logged_in', 'true');
    window.location.href = 'index.html#pdfs';
  } else {
    errorMsg.style.display = 'block';
  }
});
</script>

</body>
</html>
